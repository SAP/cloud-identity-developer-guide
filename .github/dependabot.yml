# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # VitePress / npm dependencies
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Only consider versions that have been published for at least 7 days
    cooldown:
      default-days: 7
    groups:
      # Group all non-major updates into a single PR
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major updates are not in any group, so Dependabot opens a
    # separate PR for each of them.

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
